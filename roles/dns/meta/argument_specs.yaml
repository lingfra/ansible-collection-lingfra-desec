---
# argument specs file for lingfra.desec.dns

argument_specs:
  main:
    short_description: "Main entry point for lingfra.desec.dns role"
    description:
      - "This role implements the deSEC API fields as a YAML structure."
      - "This allows to define the configuration for deSEC in your Ansible inventory alongside your other host configurations."
    author:
      - "Stella Kemmerling"
    options:
      dns_desec_authorization_token:
        type: "str"
        required: true
        description:
          - "Authorization token for deSEC API."
          - "Can be obtained at [desec.io/tokens](https://desec.io/tokens)."
      dns_domain_list:
        type: "list"
        elements: "dict"
        default: []
        description:
          - "List of domains to be managed on your deSEC account."
          - "One list item reflects one domain in the account."
        options:
          name:
            type: "str"
            required: true
            description:
              - "The domain itself, e. g. `example.com`."
          rrset_list:
            type: "list"
            elements: "dict"
            default: []
            description:
              - "The Resource Record Sets to add / remove / modify."
              - "Refer to the [RRset Field Reference](https://desec.readthedocs.io/en/latest/dns/rrsets.html#rrset-field-reference) in the deSEC DNS API documentation."
            options:
              records:
                type: "list"
                elements: "str"
                required: false
                description:
                  - "Record content strings."
                  - "Omit this variable or set it to `[]` to delete a record set."
              subname:
                type: "str"
                required: true
                description:
                  - "Subdomain string."
              ttl:
                type: "int"
                default: 3600
                description:
                  - "The time-to-live value for this record set."
              type:
                type: "str"
                required: true
                choices:
                  - "A"
                  - "AAAA"
                  - "AFSDB"
                  - "APL"
                  - "CAA"
                  - "CDNSKEY"
                  - "CDS"
                  - "CERT"
                  - "CNAME"
                  - "DHCID"
                  - "DLV"
                  - "DNAME"
                  - "DNSKEY"
                  - "DS"
                  - "EUI48"
                  - "EUI64"
                  - "HINFO"
                  - "HTTPS"
                  - "KX"
                  - "L32"
                  - "L64"
                  - "LOC"
                  - "LP"
                  - "MX"
                  - "NAPTR"
                  - "NID"
                  - "NS"
                  - "OPENPGPKEY"
                  - "PTR"
                  - "RP"
                  - "SMIMEA"
                  - "SPF"
                  - "SRV"
                  - "SSHFP"
                  - "SVCB"
                  - "TLSA"
                  - "TXT"
                  - "URI"
                description:
                  - "The type of the record set."
    examples: |
        ```yaml
        ---
        - name: "Configure deSEC DNS entries over API"
          hosts: localhost
          become: false # no need for root privileges
          gather_facts: false # no need for facts
          tasks:
            - name: "Import role lingfra.desec.dns"
              ansible.builtin.import_role:
                name: lingfra.desec.dns
              vars:
                # it is recommended to encrypt this string with Ansible vault
                dns_desec_authorization_token: 0123456789abcdefghijklmnopqrstuvwxyz

                dns_domain_list:
                  - name: example.com
                    rrset_list:
                      # adds a resource record set for web01
                      - subname: web01
                        type: A
                        ttl: 86400
                        records:
                          - 192.168.10.23
                          - 192.168.10.24

                      # deletes the AAAA record for db01
                      - subname: db01
                        type: AAAA
                        records: []

                      # omitting records also deleted the specified resource record set
                      - subname: db01
                        type: A
        ```
